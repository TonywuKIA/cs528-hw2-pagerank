apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw9-web-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: __GCP_SERVICE_ACCOUNT__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw9-web
  labels:
    app: hw9-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw9-web
  template:
    metadata:
      labels:
        app: hw9-web
    spec:
      serviceAccountName: hw9-web-ksa
      containers:
        - name: hw9-web
          image: __IMAGE_URI__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "__PROJECT_ID__"
            - name: BUCKET_NAME
              value: "__BUCKET_NAME__"
            - name: TOPIC_ID
              value: "__TOPIC_ID__"
            - name: BUILD_ID
              value: "hw9-gke"
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hw9-web
  labels:
    app: hw9-web
spec:
  type: LoadBalancer
  selector:
    app: hw9-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
